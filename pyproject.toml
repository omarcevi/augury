[project]
name = "augury"
version = "0.1.0.dev0"
description = "A terminal-native AI digest reader for research papers and engineering blogs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "click>=8.5.0",
    "ddgs>=9.16.0",
    "feedparser>=6.0.14",
    "google-adk>=2.9.2",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "pdfminer-six>=20260107",
    "platformdirs>=4.11.13",
    "pydantic>=2.13.5",
    "pylatexenc>=2.11",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "soupsieve>=2.10",
    "sqlite-vec>=0.1.9",
    "textual>=8.2.8",
    "tomli-w>=1.2.0",
    "tomlkit>=0.15.1",
    "trafilatura>=2.2.0",
]

[project.optional-dependencies]
providers = [
    "litellm>=1.84 ; python_full_version < '3.15'",
]

[project.scripts]
augury = "augury.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/augury"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: talks to real network endpoints (run with -m live)"]
addopts = "-m 'not live'"
filterwarnings = [
  "ignore:BaseAgentConfig is deprecated:DeprecationWarning",
  "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
  "ignore:\\[EXPERIMENTAL\\] feature FeatureName.JSON_SCHEMA_FOR_FUNC_DECL:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.14"
include = ["src", "tests"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
